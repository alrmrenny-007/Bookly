<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3ee" />
  <title>Dashboard | Bookly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell dash">
    <div class="topbar">
      <div class="wordmark">book<span>ly</span></div>
      <button class="btn secondary" id="logout">Log out</button>
    </div>

    <h1 id="title"><span class="skel skel-line" style="width:220px;display:inline-block"></span></h1>

    <div class="linkbox">
      <code id="link"></code>
      <button class="btn secondary" id="copy">Copy link</button>
    </div>

    <!-- BOOKINGS -->
    <section class="panel">
      <h2>Upcoming bookings</h2>
      <p class="sub" id="b-sub">New bookings show up here. Confirm them or cancel to free the time.</p>
      <div id="bookings"><div class="skel skel-block"></div><div class="skel skel-block"></div></div>
      <p class="msg" id="b-msg" role="alert"></p>
    </section>

    <!-- SERVICES -->
    <section class="panel">
      <h2>Services</h2>
      <p class="sub">What customers can book, and how long each one takes.</p>
      <div class="list" id="services"><div class="skel skel-block"></div></div>

      <form class="card" id="service-form" novalidate>
        <div class="row3">
          <div><label for="s-name">Service name</label>
            <input id="s-name" placeholder="Haircut" /></div>
          <div><label for="s-price">Price</label>
            <input id="s-price" type="number" min="0" step="0.01" placeholder="15" /></div>
          <div><label for="s-dur">Minutes</label>
            <input id="s-dur" type="number" min="5" step="5" placeholder="30" /></div>
        </div>
        <button class="btn inline" type="submit">Add service</button>
        <p class="msg" id="s-msg" role="alert"></p>
      </form>
    </section>

    <!-- HOURS -->
    <section class="panel">
      <h2>Opening hours</h2>
      <p class="sub">Customers can only book inside these times.</p>
      <div class="hours" id="hours"></div>
      <button class="btn inline" id="save-hours">Save hours</button>
      <p class="msg" id="h-msg" role="alert"></p>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const DAYS = [
      { n: 1, name: "Monday" }, { n: 2, name: "Tuesday" }, { n: 3, name: "Wednesday" },
      { n: 4, name: "Thursday" }, { n: 5, name: "Friday" }, { n: 6, name: "Saturday" },
      { n: 0, name: "Sunday" },
    ];
    let vendorId = null;

    function flash(el, text, ok = false) {
      el.textContent = text;
      el.className = "msg" + (ok ? " ok" : "");
    }

    /* ---------- Bookings ---------- */
    const fmtDay = (d) => d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
    const fmtTime = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

    async function setStatus(id, status) {
      const { error } = await db.from("bookings").update({ status }).eq("id", id);
      if (error) return flash($("b-msg"), "Couldn't update this booking. Try again.");
      flash($("b-msg"), "");
      loadBookings();
    }

    async function loadBookings() {
      const { data, error } = await db.from("bookings")
        .select("*, services(name)")
        .eq("vendor_id", vendorId)
        .neq("status", "cancelled")
        .gte("end_time", new Date().toISOString())
        .order("start_time");
      const box = $("bookings");
      if (error) return flash($("b-msg"), "Couldn't load bookings. Refresh the page.");
      box.replaceChildren();

      if (!data.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No bookings yet. Share your link to get your first one.";
        box.append(p);
        return;
      }

      const pending = data.filter((b) => b.status === "pending").length;
      $("b-sub").textContent = pending
        ? `${pending} waiting for your confirmation.`
        : "You're all caught up.";

      let lastDay = "";
      data.forEach((b) => {
        const start = new Date(b.start_time);
        const day = fmtDay(start);
        if (day !== lastDay) {
          const h = document.createElement("h3");
          h.className = "day-head"; h.textContent = day;
          box.append(h);
          lastDay = day;
        }

        const row = document.createElement("div");
        row.className = "item booking";

        const info = document.createElement("div");
        const title = document.createElement("b");
        title.textContent = `${fmtTime(start)}, ${b.services ? b.services.name : "Service"}`;
        const small = document.createElement("small");
        small.append(document.createTextNode(b.customer_name + " · "));
        const tel = document.createElement("a");
        tel.href = "tel:" + b.customer_phone.replace(/[^\d+]/g, "");
        tel.textContent = b.customer_phone;
        small.append(tel);
        info.append(title, small);

        const actions = document.createElement("div");
        actions.className = "actions";
        const tag = document.createElement("span");
        tag.className = "tag " + b.status;
        tag.textContent = b.status === "confirmed" ? "Confirmed" : "Pending";
        actions.append(tag);

        if (b.status === "pending") {
          const ok = document.createElement("button");
          ok.className = "btn secondary"; ok.textContent = "Confirm";
          ok.onclick = () => setStatus(b.id, "confirmed");
          actions.append(ok);
        }
        const no = document.createElement("button");
        no.className = "btn secondary danger"; no.textContent = "Cancel";
        no.onclick = () => {
          if (confirm(`Cancel ${b.customer_name}'s booking? This frees the time for other customers.`)) setStatus(b.id, "cancelled");
        };
        actions.append(no);

        row.append(info, actions);
        box.append(row);
      });
    }

    /* ---------- Services ---------- */
    async function loadServices() {
      const { data, error } = await db.from("services").select("*")
        .eq("vendor_id", vendorId).order("created_at");
      const box = $("services");
      box.replaceChildren();
      if (error) return flash($("s-msg"), "Couldn't load services. Refresh the page.");
      if (!data.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No services yet. Add your first one below.";
        box.append(p);
        return;
      }
      data.forEach((s) => {
        const row = document.createElement("div");
        row.className = "item";
        const info = document.createElement("div");
        const b = document.createElement("b"); b.textContent = s.name;
        const small = document.createElement("small");
        small.textContent = `${s.duration_min} min · ${Number(s.price)}`;
        info.append(b, small);
        const del = document.createElement("button");
        del.className = "btn secondary danger"; del.textContent = "Delete";
        del.onclick = async () => {
          if (!confirm(`Delete "${s.name}"? Its bookings will be deleted too.`)) return;
          const { error } = await db.from("services").delete().eq("id", s.id);
          if (error) return flash($("s-msg"), "Couldn't delete this service.");
          loadServices();
        };
        row.append(info, del);
        box.append(row);
      });
    }

    $("service-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("s-name").value.trim();
      const price = parseFloat($("s-price").value || "0");
      const dur = parseInt($("s-dur").value, 10);
      if (!name) return flash($("s-msg"), "Enter a service name.");
      if (!dur || dur < 5) return flash($("s-msg"), "Enter how many minutes it takes (at least 5).");
      if (price < 0) return flash($("s-msg"), "Price can't be negative.");
      const { error } = await db.from("services")
        .insert({ vendor_id: vendorId, name, price, duration_min: dur });
      if (error) return flash($("s-msg"), "Couldn't save this service. Try again.");
      e.target.reset();
      flash($("s-msg"), "Service added.", true);
      loadServices();
    });

    /* ---------- Opening hours ---------- */
    function buildHours(saved) {
      const box = $("hours");
      box.replaceChildren();
      DAYS.forEach((d) => {
        const s = saved.find((r) => r.weekday === d.n);
        const row = document.createElement("div");
        row.className = "day" + (s ? "" : " off");
        row.dataset.day = d.n;

        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = !!s;
        label.append(cb, document.createTextNode(d.name));

        const start = document.createElement("input");
        start.type = "time"; start.value = s ? s.start_time.slice(0, 5) : "09:00";
        start.setAttribute("aria-label", `${d.name} opens`);
        const end = document.createElement("input");
        end.type = "time"; end.value = s ? s.end_time.slice(0, 5) : "17:00";
        end.setAttribute("aria-label", `${d.name} closes`);

        cb.onchange = () => row.classList.toggle("off", !cb.checked);
        row.append(label, start, end);
        box.append(row);
      });
    }

    async function loadHours() {
      const { data, error } = await db.from("availability").select("*").eq("vendor_id", vendorId);
      if (error) flash($("h-msg"), "Couldn't load your hours. Refresh the page.");
      buildHours(data || []);
    }

    $("save-hours").onclick = async () => {
      const rows = [];
      for (const row of $("hours").children) {
        const [cb, start, end] = [
          row.querySelector('input[type="checkbox"]'),
          ...row.querySelectorAll('input[type="time"]'),
        ];
        if (!cb.checked) continue;
        if (!start.value || !end.value || end.value <= start.value) {
          return flash($("h-msg"), `${row.querySelector("label").textContent}: closing time must be after opening time.`);
        }
        rows.push({ vendor_id: vendorId, weekday: +row.dataset.day, start_time: start.value, end_time: end.value });
      }
      $("save-hours").disabled = true;
      const del = await db.from("availability").delete().eq("vendor_id", vendorId);
      if (del.error) { $("save-hours").disabled = false; return flash($("h-msg"), "Couldn't save your hours. Try again."); }
      if (rows.length) {
        const ins = await db.from("availability").insert(rows);
        if (ins.error) { $("save-hours").disabled = false; return flash($("h-msg"), "Couldn't save your hours. Try again."); }
      }
      $("save-hours").disabled = false;
      flash($("h-msg"), "Hours saved.", true);
    };

    /* ---------- Init ---------- */
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (!session) return (location.href = "login.html");

      const { data: vendor, error } = await db
        .from("vendors").select("*").eq("id", session.user.id).maybeSingle();
      if (error || !vendor) {
        $("title").textContent = "We couldn't find your business profile.";
        return;
      }
      vendorId = vendor.id;
      $("title").textContent = vendor.business_name;

      const base = location.origin + location.pathname.replace(/[^/]*$/, "");
      const url = `${base}book.html?v=${vendor.slug}`;
      $("link").textContent = url;
      $("copy").onclick = async (e) => {
        await navigator.clipboard.writeText(url);
        e.target.textContent = "Copied";
        setTimeout(() => (e.target.textContent = "Copy link"), 1500);
      };

      loadBookings();
      loadServices();
      loadHours();
      setInterval(loadBookings, 30000);
    })();

    $("logout").onclick = async () => {
      await db.auth.signOut();
      location.href = "index.html";
    };
  </script>
</body>
</html>
